<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Combo - Lobby</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .lobby-container { text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #333; }
        .button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; }
        .button:hover { background-color: #0056b3; }
        .join-form { margin-top: 30px; }
        .join-form input { font-size: 1.2em; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .join-form .button { font-size: 1.2em; padding: 12px 20px; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1>Position Combo</h1>
        <div>
            <button id="create-game-btn" class="button">Create New Game</button>
        </div>
        <div class="join-form">
            <input type="text" id="room-key-input" placeholder="Enter Room Key">
            <button id="join-game-btn" class="button">Join Game</button>
        </div>
    </div>

    <script>
        function generateRoomKey(length = 5) {
            return Math.random().toString(36).substring(2, 2 + length).toUpperCase();
        }

        document.getElementById('create-game-btn').addEventListener('click', () => {
            const roomKey = generateRoomKey();
            window.location.href = `/static/index.html?room=${roomKey}`;
        });

        document.getElementById('join-game-btn').addEventListener('click', () => {
            const roomKey = document.getElementById('room-key-input').value.trim().toUpperCase();
            if (roomKey) {
                window.location.href = `/static/index.html?room=${roomKey}`;
            } else {
                alert('Please enter a room key.');
            }
        });
        
        document.getElementById('room-key-input').addEventListener('keyup', (event) => {
            if (event.key === 'Enter') {
                document.getElementById('join-game-btn').click();
            }
        });
    </script>
</body>
</html>
